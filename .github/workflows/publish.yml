name: Publish Reefy artifact fixtures

on:
  workflow_call:
    inputs:
      input_artifact:
        required: false
        default: reefy-artifact-fixture-inputs
        type: string
    outputs:
      digest:
        description: Published OCI manifest digest
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: reefyai/reefy-artifact-fixtures
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.input_artifact }}
          path: inputs

      - name: Install artifact tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          curl -fsSL \
            https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin oras
          curl -fsSL \
            https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign-linux-amd64 \
            -o /tmp/cosign
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Build immutable fixture payload
        run: |
          . inputs/metadata.env
          python3 scripts/build_payload.py \
            --module inputs/reefy_e2e_artifact.ko \
            --kernel-release "$KERNEL_RELEASE" \
            --reefy-build-id "$REEFY_BUILD_ID" \
            --kernel-abi-digest "sha256:$REEFY_KERNEL_ABI_SHA256" \
            --output output

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: output
          format: spdx-json
          output-file: output/sbom.spdx.json

      - name: Log in to GHCR
        run: echo '${{ github.token }}' | oras login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push OCI artifact
        id: push
        run: |
          . inputs/metadata.env
          output_text=$(oras push \
            "ghcr.io/reefyai/reefy-artifact-fixtures:e2e-${REEFY_BUILD_ID}" \
            --artifact-type application/vnd.reefy.artifact.v1 \
            --config output/config.json:application/vnd.reefy.artifact.config.v1+json \
            output/common.squashfs:application/vnd.reefy.squashfs.v1 \
            output/kernel.squashfs:application/vnd.reefy.squashfs.v1)
          printf '%s\n' "$output_text"
          digest=$(printf '%s\n' "$output_text" | sed -n 's/^Digest: //p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          oras attach \
            --artifact-type application/spdx+json \
            "ghcr.io/reefyai/reefy-artifact-fixtures@$digest" \
            output/sbom.spdx.json:application/spdx+json

      - name: Sign manifest with GitHub OIDC
        run: cosign sign --yes "ghcr.io/reefyai/reefy-artifact-fixtures@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/reefyai/reefy-artifact-fixtures
          subject-digest: ${{ steps.push.outputs.digest }}
